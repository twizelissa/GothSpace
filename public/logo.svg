<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1145"/>
      <stop offset="100%" stop-color="#070512"/>
    </radialGradient>

    <!-- Vibrant primary neon gradient (Orange -> Rose -> Purple) -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>   <!-- orange-400 -->
      <stop offset="50%" stop-color="#f43f5e"/>  <!-- rose-500 -->
      <stop offset="100%" stop-color="#c084fc"/> <!-- purple-400 -->
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Ambient Glow in center -->
  <circle cx="50" cy="50" r="30" fill="#f43f5e" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Outer Habit/Tracking Progress Ring -->
  <path d="M 50,14 A 36,36 0 1,1 22,72" 
        stroke="url(#logoGrad)" 
        stroke-width="4.5" 
        fill="none" 
        stroke-linecap="round" 
        filter="url(#neonGlow)"
        opacity="0.9" />

  <path d="M 50,14 A 36,36 0 1,1 22,72" 
        stroke="url(#logoGrad)" 
        stroke-width="4.5" 
        fill="none" 
        stroke-linecap="round" 
        opacity="0.35" />

  <!-- Dotted Tracker Ring Accent -->
  <circle cx="50" cy="50" r="28" 
          stroke="url(#logoGrad)" 
          stroke-width="1.5" 
          fill="none" 
          stroke-dasharray="3 6" 
          opacity="0.4" />

  <!-- Inner Monogram ET -->
  <g stroke="url(#logoGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
    <!-- Stylized 'E' -->
    <path d="M 44,38 L 34,38 L 34,62 L 44,62" />
    <path d="M 34,50 L 41,50" />

    <!-- Stylized 'T' -->
    <path d="M 49,38 L 65,38" />
    <path d="M 57,38 L 57,62" />
  </g>

  <!-- Extra sharp overlay for the monogram (to keep edges crisp over the glow) -->
  <g stroke="url(#logoGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <!-- Stylized 'E' -->
    <path d="M 44,38 L 34,38 L 34,62 L 44,62" />
    <path d="M 34,50 L 41,50" />

    <!-- Stylized 'T' -->
    <path d="M 49,38 L 65,38" />
    <path d="M 57,38 L 57,62" />
  </g>

  <!-- Tiny futuristic '24' badge at bottom-right of the ring gap -->
  <g transform="translate(18, 68)" opacity="0.95">
    <rect x="-1" y="2" width="14" height="10" rx="3" fill="#150b30" stroke="url(#logoGrad)" stroke-width="1" />
    <text x="6" y="9" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="6.5" 
          font-weight="bold" 
          text-anchor="middle" 
          letter-spacing="-0.5">24</text>
  </g>
</svg>
