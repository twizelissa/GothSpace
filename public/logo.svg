<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <!-- Refined, premium teal-to-emerald gradient -->
    <linearGradient id="premiumGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />   <!-- Deep teal -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Bright emerald -->
    </linearGradient>
  </defs>

  <!-- Clean dark card background -->
  <rect width="100" height="100" rx="24" fill="#09090b" />

  <!-- Subtle background grid lines representing ledgers/tracking sheet -->
  <path d="M 25 0 L 25 100 M 50 0 L 50 100 M 75 0 L 75 100 M 0 25 L 100 25 M 0 50 L 100 50 M 0 75 L 100 75" 
        stroke="#18181b" 
        stroke-width="1" 
        fill="none" />

  <!-- The core geometric symbol: A checkmark sweeping upward into a growth arrow -->
  <path d="M 32 54 L 44 66 L 70 32 M 56 32 L 70 32 L 70 46" 
        stroke="url(#premiumGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
