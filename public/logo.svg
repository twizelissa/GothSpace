<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </radialGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="horizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedRect">
      <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)"/>

  <g clip-path="url(#roundedRect)">
    <!-- Ambient glow at the bottom -->
    <ellipse cx="50" cy="70" rx="45" ry="20" fill="#f43f5e" opacity="0.12"/>

    <!-- Sun rays (subtle) -->
    <g filter="url(#glow)" opacity="0.5">
      <line x1="50" y1="32" x2="50" y2="20" stroke="url(#sunGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="67" y1="37" x2="74" y2="27" stroke="url(#sunGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="33" y1="37" x2="26" y2="27" stroke="url(#sunGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="83" y2="50" stroke="url(#sunGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="28" y1="50" x2="17" y2="50" stroke="url(#sunGrad)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Sun (half-circle above horizon) -->
    <clipPath id="aboveHorizon">
      <rect x="22" y="20" width="56" height="35"/>
    </clipPath>
    <circle cx="50" cy="55" r="18" fill="url(#sunGrad)" filter="url(#softGlow)" clip-path="url(#aboveHorizon)"/>

    <!-- Horizon line -->
    <line x1="15" y1="55" x2="85" y2="55" stroke="url(#horizGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Reflection lines below horizon -->
    <g opacity="0.4">
      <line x1="35" y1="61" x2="65" y2="61" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="40" y1="67" x2="60" y2="67" stroke="#f43f5e" stroke-width="1" stroke-linecap="round"/>
      <line x1="43" y1="73" x2="57" y2="73" stroke="#f43f5e" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
